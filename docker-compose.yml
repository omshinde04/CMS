# Docker Compose manages all containers of Subhash Digital Platform

services:

  # ===============================
  # PostgreSQL Database
  # ===============================

  postgres:

    image: postgres:16

    container_name: subhash_postgres

    environment:

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: root

      POSTGRES_DB: subhash_platform

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  # ===============================
  # Backend - Node + Express
  # ===============================

  backend:

    build:

      context: ./backend

    container_name: subhash_backend

    ports:

      # Browser -> Docker -> Express
      # localhost:8080 -> container:5060

      - "8080:5060"

    env_file:

      - ./backend/.env

    depends_on:

      - postgres

    volumes:

      - ./backend:/app

      - /app/node_modules

  # ===============================
  # Frontend - Next.js
  # ===============================

  frontend:

    build:

      context: ./frontend

    container_name: subhash_frontend

    ports:

      - "3000:3000"

    depends_on:

      - backend

    volumes:

      - ./frontend:/app

      - /app/node_modules

# ===============================
# Volumes
# ===============================

volumes:

  postgres_data:
