version: "3.9"

services:

  postgres:

    image: postgres:16

    container_name: subhash_postgres

    environment:

      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: subhash_platform

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:

    build:

      context: ./backend

    container_name: subhash_backend

    ports:

      - "5060:5060"

    env_file:

      - ./backend/.env

    depends_on:

      - postgres

    volumes:

      - ./backend:/app
      - /app/node_modules

volumes:

  postgres_data:
